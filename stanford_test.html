<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Stanford WWII Borders — Test</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/pmtiles@3/dist/pmtiles.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #1a1a2e; color: #eee; }
  #map { position: absolute; top: 0; bottom: 0; width: 100%; }

  #ui {
    position: absolute;
    top: 16px; left: 50%;
    transform: translateX(-50%);
    background: rgba(20,20,40,0.92);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 10px;
    padding: 14px 20px;
    min-width: 340px;
    z-index: 10;
    backdrop-filter: blur(6px);
  }
  #ui h2 { font-size: 14px; font-weight: 600; letter-spacing: 0.05em; color: #a0aec0; margin-bottom: 10px; text-align: center; }
  #date-display { font-size: 22px; font-weight: 700; text-align: center; color: #fff; margin-bottom: 10px; letter-spacing: 0.08em; }
  #slider { width: 100%; accent-color: #4299e1; cursor: pointer; }
  #play-btn {
    display: block; width: 100%; margin-top: 10px; padding: 6px;
    background: #2b6cb0; border: none; border-radius: 6px;
    color: #fff; font-size: 13px; cursor: pointer; letter-spacing: 0.04em;
  }
  #play-btn:hover { background: #2c5282; }

  #legend {
    position: absolute;
    bottom: 30px; right: 16px;
    background: rgba(20,20,40,0.92);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 8px;
    padding: 12px 16px;
    z-index: 10;
    backdrop-filter: blur(6px);
  }
  #legend h3 { font-size: 11px; color: #a0aec0; margin-bottom: 8px; letter-spacing: 0.06em; }
  .legend-row { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; font-size: 12px; }
  .legend-swatch { width: 16px; height: 16px; border-radius: 3px; flex-shrink: 0; opacity: 0.85; }

  #tooltip {
    position: absolute;
    background: rgba(0,0,0,0.8);
    color: #fff;
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 12px;
    pointer-events: none;
    display: none;
    z-index: 20;
  }
</style>
</head>
<body>

<div id="map"></div>

<div id="ui">
  <h2>EUROPÄISCHE GRENZEN 1939–1945</h2>
  <div id="date-display">1939-01</div>
  <input type="range" id="slider" min="0" max="72" value="0" step="1">
  <button id="play-btn">▶ Abspielen</button>
</div>

<div id="legend">
  <h3>BELEGUNGSSTATUS</h3>
  <div class="legend-row"><div class="legend-swatch" style="background:#8B0000"></div>Achsenmächte / Belligerent</div>
  <div class="legend-row"><div class="legend-swatch" style="background:#c0392b"></div>Deutsch besetzt / Protektorat</div>
  <div class="legend-row"><div class="legend-swatch" style="background:#c0731a"></div>Italienisch besetzt</div>
  <div class="legend-row"><div class="legend-swatch" style="background:#1a5276"></div>Alliierte</div>
  <div class="legend-row"><div class="legend-swatch" style="background:#5D6D7E"></div>Sowjetunion</div>
  <div class="legend-row"><div class="legend-swatch" style="background:#7f8c8d"></div>Neutral</div>
  <div class="legend-row"><div class="legend-swatch" style="background:#bdc3c7"></div>Sonstige / Unbekannt</div>
</div>

<div id="tooltip"></div>

<script>
// ── PMTiles-Protokoll registrieren ─────────────────────────────────────────
const protocol = new pmtiles.Protocol();
maplibregl.addProtocol("pmtiles", protocol.tile);

// ── Datumsliste — exakt die 88 vorhandenen Shapefile-Monate ───────────────
const dates = ["1938-02","1938-03","1938-04","1938-05","1938-06","1938-07","1938-08","1938-09","1938-10","1938-11","1938-12","1939-01","1939-02","1939-03","1939-04","1939-05","1939-06","1939-07","1939-08","1939-09","1939-10","1939-11","1939-12","1940-01","1940-02","1940-03","1940-04","1940-05","1940-06","1940-07","1940-08","1940-09","1940-10","1940-11","1940-12","1941-01","1941-02","1941-03","1941-04","1941-05","1941-06","1941-07","1941-08","1941-09","1941-10","1941-11","1941-12","1942-01","1942-02","1942-03","1942-04","1942-05","1942-06","1942-07","1942-08","1942-09","1942-10","1942-11","1942-12","1943-01","1943-02","1943-03","1943-04","1943-05","1943-06","1943-07","1943-08","1943-09","1943-10","1943-11","1943-12","1944-01","1944-02","1944-03","1944-04","1944-05","1944-06","1944-07","1944-08","1944-09","1944-10","1944-11","1944-12","1945-01","1945-02","1945-03","1945-04","1945-05"];
const slider = document.getElementById('slider');
slider.max = dates.length - 1;

const dateDisplay = document.getElementById('date-display');

// ── Farbzuordnung ──────────────────────────────────────────────────────────
// Sowjetunion: vor Jun 1941 kriegführend (violett), ab Jun 1941 Alliierte (graublau).
// Muss vor dem Foreign_Po-Match stehen, weil SU bis Jun 1941 "Belligerent" hat
// (= fälschlich rot), danach "Allies" (= fälschlich blau wie UK/USA).
const COLOR_EXPR = [
  "case",
  ["all", ["==", ["get", "name"], "Soviet Union"], ["<", ["get", "date"], "1941-06"]], "#4a235a",
  ["==", ["get", "name"], "Soviet Union"],          "#5D6D7E",
  // Deutschland: nan in Aug 1942 → null in GeoJSON → würde grau → expliziter Fallback
  ["==", ["get", "name"], "Germany"],               "#8B0000",
  // Achsenmächte und Verbündete
  ["==", ["get", "foreign_po"], "Axis"],            "#8B0000",
  ["==", ["get", "foreign_po"], "Axis-aligned"],    "#8B0000",
  ["==", ["get", "foreign_po"], "Belligerent"],     "#8B0000",
  ["==", ["get", "foreign_po"], "War with Soviet Union"], "#8B0000",
  // Deutsch besetzte / kontrollierte Gebiete
  ["==", ["get", "foreign_po"], "German-occupied"],                    "#c0392b",
  ["==", ["get", "foreign_po"], "German Protectorate"],                "#c0392b",
  ["==", ["get", "foreign_po"], "German,Soviet-occupied"],             "#c0392b",
  ["==", ["get", "foreign_po"], "Axis and German-occupied"],           "#c0392b",
  ["==", ["get", "foreign_po"], "Axis and German, Italian-occupied"],  "#c0392b",
  ["==", ["get", "foreign_po"], "Axis, German, Italian-occupied"],     "#c0392b",
  ["==", ["get", "foreign_po"], "German, Italian-occupied"],           "#c0392b",
  ["==", ["get", "foreign_po"], "German, Bulgarian-occupied"],         "#c0392b",
  ["==", ["get", "foreign_po"], "German, Italian, Bulgarian-occupied"],"#c0392b",
  ["==", ["get", "foreign_po"], "Romanian-occupied"],                  "#c0392b",
  // Italienisch besetzte / kontrollierte Gebiete
  ["==", ["get", "foreign_po"], "Italian Protectorate"],  "#c0731a",
  ["==", ["get", "foreign_po"], "Italian-occupied"],      "#c0731a",
  // Alliierte
  ["==", ["get", "foreign_po"], "Allies"],          "#1a5276",
  ["==", ["get", "foreign_po"], "Allied"],          "#1a5276",
  ["==", ["get", "foreign_po"], "Allied-occupied"], "#1a5276",
  // Sowjetisch besetzte Gebiete (ohne SU selbst — oben abgefangen)
  ["==", ["get", "foreign_po"], "Soviet-occupied"], "#5D6D7E",
  // Neutral
  ["==", ["get", "foreign_po"], "Neutral"],         "#7f8c8d",
  // Alles andere (inkl. null, '<Null>', unbekannte Werte)
  "#bdc3c7"
];

// ── Karte initialisieren ───────────────────────────────────────────────────
const map = new maplibregl.Map({
  container: 'map',
  style: {
    version: 8,
    glyphs: "https://demotiles.maplibre.org/font/{fontstack}/{range}.pbf",
    sources: {
      'osm-bg': {
        type: 'raster',
        tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],
        tileSize: 256,
        attribution: '© OpenStreetMap',
        maxzoom: 19
      },
      'stanford': {
        type: 'vector',
        url: 'pmtiles://stanford_borders_hires.pmtiles',
        attribution: 'Stanford WWII Borders'
      }
    },
    layers: [
      {
        id: 'osm-background',
        type: 'raster',
        source: 'osm-bg',
        paint: { 'raster-opacity': 0.3 }
      },
      {
        id: 'borders-fill',
        type: 'fill',
        source: 'stanford',
        'source-layer': 'stanford_combined_hires',
        filter: ['==', ['get', 'date'], dates[0]],
        paint: {
          'fill-color': COLOR_EXPR,
          'fill-opacity': 0.55
        }
      },
      {
        id: 'borders-line',
        type: 'line',
        source: 'stanford',
        'source-layer': 'stanford_combined_hires',
        filter: ['==', ['get', 'date'], dates[0]],
        paint: {
          'line-color': '#ffffff',
          'line-width': 0.6,
          'line-opacity': 0.4
        }
      },
      {
        id: 'borders-label',
        type: 'symbol',
        source: 'stanford',
        'source-layer': 'stanford_combined_hires',
        filter: ['==', ['get', 'date'], dates[0]],
        layout: {
          'text-field': ['get', 'name'],
          'text-size': 10,
          'text-font': ['Noto Sans Regular'],
          'text-max-width': 8
        },
        paint: {
          'text-color': '#ffffff',
          'text-halo-color': 'rgba(0,0,0,0.7)',
          'text-halo-width': 1.5
        }
      }
    ]
  },
  center: [20, 52],
  zoom: 4
});

map.addControl(new maplibregl.NavigationControl(), 'bottom-left');

// ── Datum aktualisieren ────────────────────────────────────────────────────
function setDate(idx) {
  const d = dates[idx];
  dateDisplay.textContent = d;
  const f = ['==', ['get', 'date'], d];
  map.setFilter('borders-fill',  f);
  map.setFilter('borders-line',  f);
  map.setFilter('borders-label', f);
}

slider.addEventListener('input', () => setDate(+slider.value));

// ── Autoplay ───────────────────────────────────────────────────────────────
let playing = false;
let timer = null;
const playBtn = document.getElementById('play-btn');

playBtn.addEventListener('click', () => {
  playing = !playing;
  playBtn.textContent = playing ? '⏸ Pause' : '▶ Abspielen';
  if (playing) {
    timer = setInterval(() => {
      let v = +slider.value + 1;
      if (v >= dates.length) { v = 0; }
      slider.value = v;
      setDate(v);
    }, 500);
  } else {
    clearInterval(timer);
  }
});

// ── Tooltip ────────────────────────────────────────────────────────────────
const tooltip = document.getElementById('tooltip');
map.on('mousemove', 'borders-fill', (e) => {
  const props = e.features[0].properties;
  tooltip.style.display = 'block';
  tooltip.style.left = (e.point.x + 12) + 'px';
  tooltip.style.top  = (e.point.y + 8)  + 'px';
  tooltip.innerHTML = `<b>${props.name || '—'}</b><br>${props.foreign_po || 'Kein Status'}`;
});
map.on('mouseleave', 'borders-fill', () => { tooltip.style.display = 'none'; });
map.on('mouseenter', 'borders-fill', () => { map.getCanvas().style.cursor = 'pointer'; });
map.on('mouseleave', 'borders-fill', () => { map.getCanvas().style.cursor = ''; });
</script>
</body>
</html>
